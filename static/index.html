<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#7c3aed">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Onda">
    <title>Onda Music — Streaming Premium</title>
    <link rel="manifest" href="/manifest.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #7c3aed;
            --primary-light: #a78bfa;
            --primary-dark: #6d28d9;
            --bg: #0f0f0f;
            --bg2: #1a1a1a;
            --bg3: #2a2a2a;
            --text: #fff;
            --text-muted: #b0b0b0;
            --border: rgba(255,255,255,0.1);
            --transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
        }
        html, body { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
        #app { display: flex; flex-direction: column; height: 100vh; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; background: linear-gradient(180deg, rgba(15,15,15,0.9) 0%, rgba(15,15,15,0.4) 100%); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); z-index: 100; }
        .logo { font-size: 24px; font-weight: 800; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .color-picker-btn { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--border); background: var(--primary); cursor: pointer; transition: var(--transition); display: flex; align-items: center; justify-content: center; }
        .color-picker-btn:hover { transform: scale(1.05); border-color: var(--primary-light); }
        .color-picker-input { display: none; }
        .main { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 280px; background: var(--bg2); border-right: 1px solid var(--border); overflow-y: auto; padding: 20px 0; display: flex; flex-direction: column; }
        .sidebar-section { padding: 0 16px; margin-bottom: 24px; }
        .sidebar-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 12px; opacity: 0.6; }
        .sidebar-item { padding: 12px 16px; margin-bottom: 8px; border-radius: 8px; cursor: pointer; transition: var(--transition); font-size: 14px; color: var(--text-muted); display: flex; align-items: center; gap: 12px; }
        .sidebar-item:hover { background: rgba(124,58,237,0.1); color: var(--text); }
        .sidebar-item.active { background: linear-gradient(90deg, var(--primary) 0%, rgba(124,58,237,0.2) 100%); color: var(--text); font-weight: 600; }
        .content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .search-bar { padding: 20px 24px; border-bottom: 1px solid var(--border); background: linear-gradient(180deg, rgba(26,26,26,0.8) 0%, rgba(26,26,26,0.4) 100%); backdrop-filter: blur(10px); }
        .search-input { width: 100%; padding: 12px 16px; border-radius: 24px; border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: var(--text); font-size: 14px; transition: var(--transition); outline: none; }
        .search-input:focus { background: rgba(124,58,237,0.1); border-color: var(--primary); box-shadow: 0 0 20px rgba(124,58,237,0.2); }
        .search-input::placeholder { color: var(--text-muted); }
        .suggestions { position: absolute; top: 100%; left: 0; right: 0; background: var(--bg2); border: 1px solid var(--border); border-top: none; border-radius: 0 0 12px 12px; max-height: 300px; overflow-y: auto; z-index: 50; display: none; }
        .suggestions.active { display: block; }
        .suggestion-item { padding: 12px 16px; cursor: pointer; transition: var(--transition); border-bottom: 1px solid var(--border); font-size: 13px; }
        .suggestion-item:hover { background: rgba(124,58,237,0.1); }
        .scroll-area { flex: 1; overflow-y: auto; padding: 24px; }
        .section { margin-bottom: 48px; }
        .section-title { font-size: 24px; font-weight: 700; margin-bottom: 20px; letter-spacing: -0.5px; }
        .section-subtitle { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; opacity: 0.6; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
        .grid.wide { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
        .card { background: linear-gradient(135deg, rgba(124,58,237,0.1) 0%, rgba(124,58,237,0.05) 100%); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 12px; padding: 16px; cursor: pointer; transition: var(--transition); display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
        .card:hover { background: linear-gradient(135deg, rgba(124,58,237,0.2) 0%, rgba(124,58,237,0.1) 100%); border-color: var(--primary); transform: translateY(-4px); }
        .card-image { width: 100%; aspect-ratio: 1; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 48px; overflow: hidden; }
        .card-image img { width: 100%; height: 100%; object-fit: cover; }
        .card-title { font-size: 14px; font-weight: 600; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-subtitle { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player { background: linear-gradient(180deg, rgba(26,26,26,0.95) 0%, rgba(15,15,15,0.95) 100%); backdrop-filter: blur(20px); border-top: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; gap: 16px; z-index: 200; }
        .player-info { flex: 1; min-width: 0; }
        .player-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-artist { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-controls { display: flex; align-items: center; gap: 12px; }
        .player-btn { width: 40px; height: 40px; border-radius: 50%; background: rgba(124,58,237,0.2); border: 1px solid var(--border); color: var(--text); cursor: pointer; transition: var(--transition); display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .player-btn:hover { background: var(--primary); border-color: var(--primary); transform: scale(1.05); }
        .player-btn.play { width: 48px; height: 48px; background: var(--primary); border-color: var(--primary); }
        .player-progress { flex: 1; display: flex; align-items: center; gap: 8px; }
        .progress-bar { flex: 1; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; cursor: pointer; position: relative; }
        .progress-fill { height: 100%; background: var(--primary); border-radius: 2px; transition: width 0.1s linear; }
        .time-label { font-size: 12px; color: var(--text-muted); min-width: 40px; text-align: right; }
        .loading { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--text-muted); font-size: 14px; padding: 40px; }
        .loading-dot { width: 6px; height: 6px; background: var(--primary); border-radius: 50%; animation: pulse 1.4s infinite; }
        .loading-dot:nth-child(2) { animation-delay: 0.2s; }
        .loading-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 40px; text-align: center; color: var(--text-muted); }
        .empty-state-icon { font-size: 64px; opacity: 0.3; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-light); }
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .header { padding: 12px 16px; }
            .scroll-area { padding: 16px; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
            .player { flex-wrap: wrap; padding: 12px 16px; }
            .player-info { flex: 1 0 100%; }
            .player-controls { flex: 1; justify-content: space-between; }
            .player-progress { flex: 1 0 100%; margin-top: 8px; }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="header">
            <div class="logo">🎵 Onda</div>
            <button class="color-picker-btn" id="colorPickerBtn">
                <input type="color" id="colorPicker" class="color-picker-input" value="#7c3aed">
            </button>
        </div>
        <div class="main">
            <div class="sidebar">
                <div class="sidebar-section">
                    <div class="sidebar-title">Menu</div>
                    <div class="sidebar-item active" data-view="home">🏠 Home</div>
                    <div class="sidebar-item" data-view="search">🔍 Ricerca</div>
                </div>
            </div>
            <div class="content">
                <div class="search-bar" id="searchBar" style="display: none;">
                    <div style="position: relative;">
                        <input type="text" class="search-input" id="searchInput" placeholder="Cerca brani, album, artisti...">
                        <div class="suggestions" id="suggestionsDropdown"></div>
                    </div>
                </div>
                <div class="scroll-area" id="scrollArea"></div>
            </div>
        </div>
        <div class="player">
            <div class="player-info">
                <div class="player-title" id="playerTitle">Seleziona un brano</div>
                <div class="player-artist" id="playerArtist">Onda Music</div>
            </div>
            <div class="player-progress">
                <span class="time-label" id="currentTime">0:00</span>
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <span class="time-label" id="duration">0:00</span>
            </div>
            <div class="player-controls">
                <button class="player-btn" id="prevBtn">⏮</button>
                <button class="player-btn play" id="playBtn">▶</button>
                <button class="player-btn" id="nextBtn">⏭</button>
            </div>
        </div>
    </div>
    <audio id="audioPlayer"></audio>
    <script>
        let state = { currentTrack: null, isPlaying: false, queue: [], queueIndex: 0, currentView: 'home', primaryColor: '#7c3aed' };
        const app = document.getElementById('app');
        const scrollArea = document.getElementById('scrollArea');
        const searchBar = document.getElementById('searchBar');
        const searchInput = document.getElementById('searchInput');
        const suggestionsDropdown = document.getElementById('suggestionsDropdown');
        const audioPlayer = document.getElementById('audioPlayer');
        const playerTitle = document.getElementById('playerTitle');
        const playerArtist = document.getElementById('playerArtist');
        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const currentTimeLabel = document.getElementById('currentTime');
        const durationLabel = document.getElementById('duration');
        const colorPicker = document.getElementById('colorPicker');
        const colorPickerBtn = document.getElementById('colorPickerBtn');

        colorPickerBtn.addEventListener('click', () => colorPicker.click());
        colorPicker.addEventListener('change', (e) => {
            state.primaryColor = e.target.value;
            document.documentElement.style.setProperty('--primary', state.primaryColor);
            document.documentElement.style.setProperty('--primary-light', lightenColor(state.primaryColor, 30));
            document.documentElement.style.setProperty('--primary-dark', darkenColor(state.primaryColor, 30));
            localStorage.setItem('primaryColor', state.primaryColor);
        });

        function lightenColor(hex, percent) {
            const num = parseInt(hex.replace("#", ""), 16);
            const amt = Math.round(2.55 * percent);
            const R = Math.min(255, (num >> 16) + amt);
            const G = Math.min(255, (num >> 8 & 0x00FF) + amt);
            const B = Math.min(255, (num & 0x0000FF) + amt);
            return "#" + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
        }

        function darkenColor(hex, percent) {
            const num = parseInt(hex.replace("#", ""), 16);
            const amt = Math.round(2.55 * percent);
            const R = Math.max(0, (num >> 16) - amt);
            const G = Math.max(0, (num >> 8 & 0x00FF) - amt);
            const B = Math.max(0, (num & 0x0000FF) - amt);
            return "#" + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
        }

        function formatTime(seconds) {
            if (!seconds || isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        async function fetchAPI(endpoint) {
            try {
                const response = await fetch(`/api${endpoint}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return await response.json();
            } catch (error) {
                console.error(`API Error: ${endpoint}`, error);
                return null;
            }
        }

        async function renderHome() {
            scrollArea.innerHTML = '<div class="loading"><div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div></div>';
            const data = await fetchAPI('/home');
            if (!data) {
                scrollArea.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🎵</div><p>Errore nel caricamento</p></div>';
                return;
            }
            let html = '';
            if (data.trending && data.trending.length > 0) {
                html += `<div class="section"><div class="section-subtitle">Tendenze Oggi</div><div class="grid wide">`;
                data.trending.slice(0, 6).forEach(track => {
                    html += `<div class="card" onclick="playTrack('${track.videoId}', '${track.title.replace(/'/g, "\\'")}', '${track.artists?.[0]?.name?.replace(/'/g, "\\'") || 'Artista'}')"><div class="card-image">${track.thumbnail ? `<img src="${track.thumbnail}" alt="">` : '🎵'}</div><div class="card-title">${track.title}</div><div class="card-subtitle">${track.artists?.[0]?.name || 'Artista'}</div></div>`;
                });
                html += '</div></div>';
            }
            if (data.new_releases && data.new_releases.length > 0) {
                html += `<div class="section"><div class="section-subtitle">Nuove Uscite</div><div class="grid wide">`;
                data.new_releases.slice(0, 6).forEach(album => {
                    html += `<div class="card"><div class="card-image">${album.thumbnails?.[0]?.url ? `<img src="${album.thumbnails[0].url}" alt="">` : '💿'}</div><div class="card-title">${album.title}</div><div class="card-subtitle">${album.subtitle || 'Album'}</div></div>`;
                });
                html += '</div></div>';
            }
            scrollArea.innerHTML = html || '<div class="empty-state"><div class="empty-state-icon">🎵</div><p>Nessun contenuto disponibile</p></div>';
        }

        async function renderSearch(query) {
            if (!query) {
                scrollArea.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🔍</div><p>Inizia a cercare</p></div>';
                return;
            }
            scrollArea.innerHTML = '<div class="loading"><div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div></div>';
            const data = await fetchAPI(`/search?q=${encodeURIComponent(query)}&type=all`);
            if (!data) {
                scrollArea.innerHTML = '<div class="empty-state"><div class="empty-state-icon">❌</div><p>Nessun risultato</p></div>';
                return;
            }
            let html = '';
            if (data.songs && data.songs.length > 0) {
                html += `<div class="section"><div class="section-title">Brani</div><div class="grid">`;
                data.songs.slice(0, 12).forEach(track => {
                    html += `<div class="card" onclick="playTrack('${track.videoId}', '${track.title.replace(/'/g, "\\'")}', '${track.artists?.[0]?.name?.replace(/'/g, "\\'") || 'Artista'}')"><div class="card-image">${track.thumbnail ? `<img src="${track.thumbnail}" alt="">` : '🎵'}</div><div class="card-title">${track.title}</div><div class="card-subtitle">${track.artists?.[0]?.name || 'Artista'}</div></div>`;
                });
                html += '</div></div>';
            }
            if (data.albums && data.albums.length > 0) {
                html += `<div class="section"><div class="section-title">Album</div><div class="grid">`;
                data.albums.slice(0, 12).forEach(album => {
                    html += `<div class="card"><div class="card-image">${album.thumbnails?.[0]?.url ? `<img src="${album.thumbnails[0].url}" alt="">` : '💿'}</div><div class="card-title">${album.title}</div><div class="card-subtitle">${album.subtitle || 'Album'}</div></div>`;
                });
                html += '</div></div>';
            }
            if (data.artists && data.artists.length > 0) {
                html += `<div class="section"><div class="section-title">Artisti</div><div class="grid">`;
                data.artists.slice(0, 12).forEach(artist => {
                    html += `<div class="card"><div class="card-image">${artist.thumbnails?.[0]?.url ? `<img src="${artist.thumbnails[0].url}" alt="">` : '👤'}</div><div class="card-title">${artist.name}</div><div class="card-subtitle">Artista</div></div>`;
                });
                html += '</div></div>';
            }
            scrollArea.innerHTML = html || '<div class="empty-state"><div class="empty-state-icon">❌</div><p>Nessun risultato</p></div>';
        }

        async function playTrack(videoId, title, artist) {
            state.currentTrack = { videoId, title, artist };
            playerTitle.textContent = title;
            playerArtist.textContent = artist;
            playBtn.textContent = '⏸';
            state.isPlaying = true;
            const streamData = await fetchAPI(`/stream/${videoId}`);
            if (streamData && streamData.url) {
                audioPlayer.src = streamData.url;
                audioPlayer.play();
            } else {
                alert('Errore nel caricamento del brano');
                state.isPlaying = false;
                playBtn.textContent = '▶';
            }
        }

        playBtn.addEventListener('click', () => {
            if (!state.currentTrack) return;
            if (state.isPlaying) {
                audioPlayer.pause();
                playBtn.textContent = '▶';
                state.isPlaying = false;
            } else {
                audioPlayer.play();
                playBtn.textContent = '⏸';
                state.isPlaying = true;
            }
        });

        audioPlayer.addEventListener('timeupdate', () => {
            const percent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
            progressFill.style.width = `${percent}%`;
            currentTimeLabel.textContent = formatTime(audioPlayer.currentTime);
            durationLabel.textContent = formatTime(audioPlayer.duration);
        });

        progressBar.addEventListener('click', (e) => {
            const rect = progressBar.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audioPlayer.currentTime = percent * audioPlayer.duration;
        });

        searchInput.addEventListener('input', async (e) => {
            const query = e.target.value.trim();
            if (query.length > 0) {
                const suggestions = await fetchAPI(`/suggestions?q=${encodeURIComponent(query)}`);
                if (suggestions && suggestions.suggestions) {
                    suggestionsDropdown.innerHTML = suggestions.suggestions.slice(0, 5).map(s => 
                        `<div class="suggestion-item" onclick="searchAndRender('${s.replace(/'/g, "\\'")}')">${s}</div>`
                    ).join('');
                    suggestionsDropdown.classList.add('active');
                }
            } else {
                suggestionsDropdown.classList.remove('active');
            }
        });

        function searchAndRender(query) {
            searchInput.value = query;
            suggestionsDropdown.classList.remove('active');
            renderSearch(query);
        }

        document.querySelectorAll('.sidebar-item').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                const view = item.dataset.view;
                if (view === 'home') {
                    searchBar.style.display = 'none';
                    renderHome();
                } else if (view === 'search') {
                    searchBar.style.display = 'block';
                    searchInput.focus();
                }
            });
        });

        const savedColor = localStorage.getItem('primaryColor');
        if (savedColor) {
            colorPicker.value = savedColor;
            colorPicker.dispatchEvent(new Event('change'));
        }

        renderHome();
    </script>
</body>
</html>
