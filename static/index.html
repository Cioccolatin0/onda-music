<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Onda"/>
<meta name="theme-color" content="#0b0614"/>
<link rel="manifest" href="/manifest.json"/>
<link rel="apple-touch-icon" href="/static/icons/icon-180.png"/>
<title>Onda Music</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0b0614;--bg2:#130d22;--bg3:#1e1535;--card:#1a1230;
  --accent:#c026d3;--accent2:#ec4899;--text:#f1f0f5;--muted:#8b7fa8;
  --radius:14px;--player-h:80px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
/* ── Topbar ── */
#topbar{display:flex;align-items:center;gap:10px;padding:env(safe-area-inset-top,12px) 16px 10px;background:var(--bg);z-index:10;flex-shrink:0}
#logo{font-size:22px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;flex-shrink:0}
#search-wrap{flex:1;position:relative}
#search-input{width:100%;background:var(--bg3);border:none;border-radius:24px;padding:9px 16px 9px 38px;color:var(--text);font-size:15px;outline:none}
#search-input::placeholder{color:var(--muted)}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px;pointer-events:none}
#clear-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;display:none}
#suggestions{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--bg2);border-radius:12px;z-index:100;overflow:hidden;box-shadow:0 8px 32px #0008;display:none}
.sug-item{padding:11px 16px;cursor:pointer;font-size:14px;color:var(--text)}
.sug-item:hover{background:var(--bg3)}
/* ── Tabs ── */
#tabs{display:flex;gap:6px;padding:0 16px 10px;flex-shrink:0;overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{padding:6px 16px;border-radius:20px;background:var(--bg3);border:none;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0}
.tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
/* ── Scroll area ── */
#scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 0 calc(var(--player-h) + env(safe-area-inset-bottom,0px) + 16px);scrollbar-width:thin;scrollbar-color:var(--bg3) transparent}
/* ── Sections ── */
.section{margin:0 0 24px}
.section-title{font-size:17px;font-weight:700;padding:0 16px 10px;color:var(--text)}
/* horizontal scroll rows */
.hscroll{display:flex;gap:12px;padding:0 16px;overflow-x:auto;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
/* vertical list */
.vlist{display:flex;flex-direction:column;gap:2px;padding:0 8px}
/* ── Cards ── */
.card-sq{flex-shrink:0;width:140px;cursor:pointer}
.card-sq img{width:140px;height:140px;border-radius:var(--radius);object-fit:cover;background:var(--bg3)}
.card-sq .ct{font-size:13px;font-weight:600;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-sq .cs{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
/* artist circle */
.card-art{flex-shrink:0;width:110px;cursor:pointer;text-align:center}
.card-art img{width:110px;height:110px;border-radius:50%;object-fit:cover;background:var(--bg3)}
.card-art .ct{font-size:12px;font-weight:600;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* song row */
.song-row{display:flex;align-items:center;gap:12px;padding:8px 8px;border-radius:10px;cursor:pointer;transition:background .15s}
.song-row:hover,.song-row:active{background:var(--bg3)}
.song-row.playing{background:var(--bg3)}
.song-row img{width:48px;height:48px;border-radius:8px;object-fit:cover;background:var(--bg3);flex-shrink:0}
.song-row .si{flex:1;min-width:0}
.song-row .st{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-row .sa{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.song-row .sd{font-size:12px;color:var(--muted);flex-shrink:0}
.song-row .play-ind{width:18px;flex-shrink:0;text-align:center;color:var(--accent)}
/* ── Player ── */
#player{position:fixed;bottom:0;left:0;right:0;height:calc(var(--player-h) + env(safe-area-inset-bottom,0px));background:var(--bg2);border-top:1px solid var(--bg3);display:flex;flex-direction:column;z-index:50;padding-bottom:env(safe-area-inset-bottom,0px)}
#player.hidden{display:none}
#progress-bar{width:100%;height:3px;background:var(--bg3);cursor:pointer;flex-shrink:0}
#progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0%;transition:width .5s linear;pointer-events:none}
#player-inner{display:flex;align-items:center;gap:12px;padding:0 16px;flex:1}
#player-thumb{width:46px;height:46px;border-radius:8px;object-fit:cover;background:var(--bg3);flex-shrink:0}
#player-info{flex:1;min-width:0}
#player-title{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#player-artist{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
#player-controls{display:flex;align-items:center;gap:6px}
.ctrl-btn{background:none;border:none;color:var(--text);font-size:22px;cursor:pointer;padding:6px;border-radius:50%;transition:background .15s;display:flex;align-items:center;justify-content:center}
.ctrl-btn:active{background:var(--bg3)}
#play-btn{font-size:28px;color:var(--accent)}
/* ── Detail views ── */
#detail{position:fixed;inset:0;background:var(--bg);z-index:40;display:none;flex-direction:column;overflow-y:auto}
#detail.open{display:flex}
#detail-header{display:flex;align-items:center;gap:12px;padding:env(safe-area-inset-top,16px) 16px 12px;background:var(--bg);position:sticky;top:0;z-index:5}
#back-btn{background:none;border:none;color:var(--text);font-size:22px;cursor:pointer;padding:4px}
#detail-title{font-size:17px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#detail-hero{padding:0 16px 16px;display:flex;gap:16px;align-items:flex-end}
#detail-hero img{width:130px;height:130px;border-radius:var(--radius);object-fit:cover;background:var(--bg3);flex-shrink:0}
#detail-meta{flex:1;min-width:0}
#detail-meta h2{font-size:20px;font-weight:800;margin-bottom:4px}
#detail-meta p{font-size:13px;color:var(--muted);margin-bottom:8px}
#detail-play-btn{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;padding:10px 24px;border-radius:24px;font-size:14px;font-weight:700;cursor:pointer}
#detail-tracks{padding:0 8px 100px}
/* ── Spinner ── */
.spinner{width:36px;height:36px;border:3px solid var(--bg3);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
/* ── Empty ── */
.empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:15px}
/* ── Scrollbar ── */
#scroll::-webkit-scrollbar{width:4px}
#scroll::-webkit-scrollbar-track{background:transparent}
#scroll::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:2px}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div id="logo">Onda</div>
    <div id="search-wrap">
      <span class="search-icon">🔍</span>
      <input id="search-input" type="search" placeholder="Cerca brani, album, artisti…" autocomplete="off" autocorrect="off" spellcheck="false"/>
      <button id="clear-btn">✕</button>
      <div id="suggestions"></div>
    </div>
  </div>
  <div id="tabs">
    <button class="tab active" data-tab="all">Tutto</button>
    <button class="tab" data-tab="songs">Brani</button>
    <button class="tab" data-tab="albums">Album</button>
    <button class="tab" data-tab="artists">Artisti</button>
  </div>
  <div id="scroll">
    <div id="main-content"></div>
  </div>
</div>

<!-- Detail overlay -->
<div id="detail">
  <div id="detail-header">
    <button id="back-btn">‹</button>
    <span id="detail-title"></span>
  </div>
  <div id="detail-hero">
    <img id="detail-img" src="" alt=""/>
    <div id="detail-meta">
      <h2 id="detail-name"></h2>
      <p id="detail-sub"></p>
      <button id="detail-play-btn">▶ Riproduci tutto</button>
    </div>
  </div>
  <div id="detail-tracks"></div>
</div>

<!-- Player -->
<div id="player" class="hidden">
  <div id="progress-bar"><div id="progress-fill"></div></div>
  <div id="player-inner">
    <img id="player-thumb" src="" alt=""/>
    <div id="player-info">
      <div id="player-title">—</div>
      <div id="player-artist">—</div>
    </div>
    <div id="player-controls">
      <button class="ctrl-btn" id="prev-btn">⏮</button>
      <button class="ctrl-btn" id="play-btn">▶</button>
      <button class="ctrl-btn" id="next-btn">⏭</button>
    </div>
  </div>
</div>

<audio id="audio" preload="none"></audio>

<script>
// ── State ──────────────────────────────────────────────────────────────────
const state = {
  tab: 'all',
  query: '',
  queue: [],      // [{videoId, title, artists, thumbnail, album}]
  queueIdx: -1,
  playing: false,
  homeData: null,
};

// ── DOM refs ──────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const audio = $('audio');
const playerEl = $('player');
const playBtn = $('play-btn');
const progressFill = $('progress-fill');
const mainContent = $('main-content');
const searchInput = $('search-input');
const clearBtn = $('clear-btn');
const suggestionsEl = $('suggestions');
const detailEl = $('detail');

// ── API helpers ────────────────────────────────────────────────────────────
async function api(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

function streamUrl(videoId) {
  return `/api/stream/${videoId}`;
}

// ── Render helpers ─────────────────────────────────────────────────────────
function img(src, cls) {
  return `<img src="${src || ''}" class="${cls}" onerror="this.src=''" loading="lazy"/>`;
}
function artistNames(artists) {
  return (artists || []).map(a => a.name).filter(Boolean).join(', ') || 'Artista sconosciuto';
}
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Song row ──────────────────────────────────────────────────────────────
function songRowHtml(track, idx, queue) {
  const isCurrent = state.queue.length && state.queue[state.queueIdx]?.videoId === track.videoId;
  return `<div class="song-row${isCurrent ? ' playing' : ''}" data-idx="${idx}" data-queue="${encodeURIComponent(JSON.stringify(queue))}">
    ${img(track.thumbnail, '')}
    <div class="si">
      <div class="st">${esc(track.title)}</div>
      <div class="sa">${esc(artistNames(track.artists))}</div>
    </div>
    <div class="sd">${esc(track.duration || '')}</div>
    <div class="play-ind">${isCurrent && state.playing ? '▶' : ''}</div>
  </div>`;
}

// ── Album card ────────────────────────────────────────────────────────────
function albumCardHtml(album) {
  return `<div class="card-sq" data-browse="${esc(album.browseId)}" data-type="album">
    ${img(album.thumbnail, '')}
    <div class="ct">${esc(album.title)}</div>
    <div class="cs">${esc(artistNames(album.artists))}</div>
  </div>`;
}

// ── Artist card ───────────────────────────────────────────────────────────
function artistCardHtml(artist) {
  return `<div class="card-art" data-browse="${esc(artist.browseId)}" data-type="artist">
    ${img(artist.thumbnail, '')}
    <div class="ct">${esc(artist.name)}</div>
  </div>`;
}

// ── Home ──────────────────────────────────────────────────────────────────
async function renderHome() {
  mainContent.innerHTML = '<div class="spinner"></div>';
  try {
    const data = state.homeData || await api('/api/home');
    state.homeData = data;
    let html = '';
    for (const sec of data.sections || []) {
      if (!sec.items?.length) continue;
      html += `<div class="section"><div class="section-title">${esc(sec.title)}</div>`;
      if (sec.kind === 'artists') {
        html += '<div class="hscroll">' + sec.items.map(artistCardHtml).join('') + '</div>';
      } else if (sec.kind === 'albums') {
        html += '<div class="hscroll">' + sec.items.map(albumCardHtml).join('') + '</div>';
      } else {
        // songs
        const queue = sec.items.filter(t => t.videoId);
        html += '<div class="vlist">' + queue.map((t, i) => songRowHtml(t, i, queue)).join('') + '</div>';
      }
      html += '</div>';
    }
    mainContent.innerHTML = html || '<div class="empty">Nessun contenuto disponibile</div>';
  } catch(e) {
    mainContent.innerHTML = `<div class="empty">Errore nel caricamento della home.<br><small>${e.message}</small></div>`;
  }
}

// ── Search ────────────────────────────────────────────────────────────────
let searchTimer = null;
async function doSearch(q, tab) {
  if (!q.trim()) { renderHome(); return; }
  mainContent.innerHTML = '<div class="spinner"></div>';
  try {
    const data = await api(`/api/search?q=${encodeURIComponent(q)}&type=${tab}`);
    renderSearchResults(data, tab);
  } catch(e) {
    mainContent.innerHTML = `<div class="empty">Errore: ${e.message}</div>`;
  }
}

function renderSearchResults(data, tab) {
  const { songs = [], albums = [], artists = [] } = data;
  let html = '';

  if (tab === 'all' || tab === 'songs') {
    if (songs.length) {
      html += `<div class="section"><div class="section-title">Brani</div><div class="vlist">`;
      html += songs.map((t, i) => songRowHtml(t, i, songs)).join('');
      html += '</div></div>';
    }
  }
  if (tab === 'all' || tab === 'albums') {
    if (albums.length) {
      html += `<div class="section"><div class="section-title">Album</div><div class="hscroll">`;
      html += albums.map(albumCardHtml).join('');
      html += '</div></div>';
    }
  }
  if (tab === 'all' || tab === 'artists') {
    if (artists.length) {
      html += `<div class="section"><div class="section-title">Artisti</div><div class="hscroll">`;
      html += artists.map(artistCardHtml).join('');
      html += '</div></div>';
    }
  }
  mainContent.innerHTML = html || '<div class="empty">Nessun risultato trovato.</div>';
}

// ── Suggestions ───────────────────────────────────────────────────────────
let sugTimer = null;
async function loadSuggestions(q) {
  if (!q.trim()) { hideSuggestions(); return; }
  try {
    const d = await api(`/api/suggestions?q=${encodeURIComponent(q)}`);
    if (!d.suggestions?.length) { hideSuggestions(); return; }
    suggestionsEl.innerHTML = d.suggestions.map(s =>
      `<div class="sug-item">${esc(s)}</div>`
    ).join('');
    suggestionsEl.style.display = 'block';
  } catch { hideSuggestions(); }
}
function hideSuggestions() {
  suggestionsEl.style.display = 'none';
  suggestionsEl.innerHTML = '';
}

// ── Detail view ───────────────────────────────────────────────────────────
async function openAlbum(browseId) {
  detailEl.classList.add('open');
  $('detail-tracks').innerHTML = '<div class="spinner"></div>';
  $('detail-name').textContent = '…';
  $('detail-sub').textContent = '';
  $('detail-img').src = '';
  try {
    const d = await api(`/api/album/${browseId}`);
    $('detail-title').textContent = d.title;
    $('detail-name').textContent = d.title;
    $('detail-sub').textContent = `${artistNames(d.artists)}${d.year ? ' · ' + d.year : ''}${d.trackCount ? ' · ' + d.trackCount + ' brani' : ''}`;
    $('detail-img').src = d.thumbnail || '';
    const tracks = d.tracks || [];
    $('detail-tracks').innerHTML = '<div class="vlist">' +
      tracks.map((t, i) => songRowHtml(t, i, tracks)).join('') +
      '</div>';
    $('detail-play-btn').onclick = () => { if (tracks.length) playQueue(tracks, 0); };
  } catch(e) {
    $('detail-tracks').innerHTML = `<div class="empty">Errore: ${e.message}</div>`;
  }
}

async function openArtist(browseId) {
  detailEl.classList.add('open');
  $('detail-tracks').innerHTML = '<div class="spinner"></div>';
  $('detail-name').textContent = '…';
  $('detail-sub').textContent = '';
  $('detail-img').src = '';
  try {
    const d = await api(`/api/artist/${browseId}`);
    $('detail-title').textContent = d.name;
    $('detail-name').textContent = d.name;
    $('detail-sub').textContent = d.subscribers ? d.subscribers + ' iscritti' : '';
    $('detail-img').src = d.thumbnail || '';

    let html = '';
    if (d.songs?.length) {
      html += `<div class="section"><div class="section-title">Brani popolari</div><div class="vlist">`;
      html += d.songs.map((t, i) => songRowHtml(t, i, d.songs)).join('');
      html += '</div></div>';
    }
    if (d.albums?.length) {
      html += `<div class="section"><div class="section-title">Album</div><div class="hscroll">`;
      html += d.albums.map(albumCardHtml).join('');
      html += '</div></div>';
    }
    if (d.singles?.length) {
      html += `<div class="section"><div class="section-title">Singoli</div><div class="hscroll">`;
      html += d.singles.map(albumCardHtml).join('');
      html += '</div></div>';
    }
    $('detail-tracks').innerHTML = html || '<div class="empty">Nessun contenuto</div>';
    $('detail-play-btn').onclick = () => { if (d.songs?.length) playQueue(d.songs, 0); };
  } catch(e) {
    $('detail-tracks').innerHTML = `<div class="empty">Errore: ${e.message}</div>`;
  }
}

// ── Player ────────────────────────────────────────────────────────────────
function playQueue(queue, idx) {
  state.queue = queue;
  state.queueIdx = idx;
  playTrack(queue[idx]);
}

function playTrack(track) {
  if (!track?.videoId) return;
  $('player-title').textContent = track.title || '—';
  $('player-artist').textContent = artistNames(track.artists);
  $('player-thumb').src = track.thumbnail || '';
  playerEl.classList.remove('hidden');
  audio.src = streamUrl(track.videoId);
  audio.load();
  audio.play().catch(() => {});
  state.playing = true;
  updatePlayBtn();
  highlightCurrentRow();
}

function updatePlayBtn() {
  playBtn.textContent = state.playing ? '⏸' : '▶';
}

function highlightCurrentRow() {
  document.querySelectorAll('.song-row').forEach(r => r.classList.remove('playing'));
  const cur = state.queue[state.queueIdx];
  if (!cur) return;
  document.querySelectorAll('.song-row').forEach(r => {
    try {
      const q = JSON.parse(decodeURIComponent(r.dataset.queue || '[]'));
      const idx = parseInt(r.dataset.idx);
      if (q[idx]?.videoId === cur.videoId) r.classList.add('playing');
    } catch {}
  });
}

// Progress
audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  progressFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
});
$('progress-bar').addEventListener('click', e => {
  if (!audio.duration) return;
  const pct = e.offsetX / e.currentTarget.offsetWidth;
  audio.currentTime = pct * audio.duration;
});

// Auto next
audio.addEventListener('ended', () => {
  const next = state.queueIdx + 1;
  if (next < state.queue.length) { state.queueIdx = next; playTrack(state.queue[next]); }
  else { state.playing = false; updatePlayBtn(); }
});
audio.addEventListener('play', () => { state.playing = true; updatePlayBtn(); });
audio.addEventListener('pause', () => { state.playing = false; updatePlayBtn(); });

playBtn.addEventListener('click', () => {
  if (audio.paused) audio.play();
  else audio.pause();
});
$('prev-btn').addEventListener('click', () => {
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  const prev = state.queueIdx - 1;
  if (prev >= 0) { state.queueIdx = prev; playTrack(state.queue[prev]); }
});
$('next-btn').addEventListener('click', () => {
  const next = state.queueIdx + 1;
  if (next < state.queue.length) { state.queueIdx = next; playTrack(state.queue[next]); }
});

// ── Event delegation ──────────────────────────────────────────────────────
function handleClick(e) {
  // song row
  const row = e.target.closest('.song-row');
  if (row) {
    try {
      const queue = JSON.parse(decodeURIComponent(row.dataset.queue));
      const idx = parseInt(row.dataset.idx);
      playQueue(queue, idx);
    } catch {}
    return;
  }
  // album card
  const albumCard = e.target.closest('[data-type="album"]');
  if (albumCard) { openAlbum(albumCard.dataset.browse); return; }
  // artist card
  const artistCard = e.target.closest('[data-type="artist"]');
  if (artistCard) { openArtist(artistCard.dataset.browse); return; }
}

mainContent.addEventListener('click', handleClick);
detailEl.addEventListener('click', handleClick);

$('back-btn').addEventListener('click', () => {
  detailEl.classList.remove('open');
});

// ── Search events ─────────────────────────────────────────────────────────
searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim();
  clearBtn.style.display = q ? 'block' : 'none';
  state.query = q;
  clearTimeout(sugTimer);
  sugTimer = setTimeout(() => loadSuggestions(q), 300);
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => doSearch(q, state.tab), 600);
});

searchInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    hideSuggestions();
    clearTimeout(searchTimer);
    doSearch(state.query, state.tab);
  }
});

clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  clearBtn.style.display = 'none';
  state.query = '';
  hideSuggestions();
  renderHome();
});

suggestionsEl.addEventListener('click', e => {
  const item = e.target.closest('.sug-item');
  if (!item) return;
  const q = item.textContent;
  searchInput.value = q;
  state.query = q;
  hideSuggestions();
  doSearch(q, state.tab);
});

document.addEventListener('click', e => {
  if (!e.target.closest('#search-wrap')) hideSuggestions();
});

// ── Tabs ──────────────────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.tab = btn.dataset.tab;
    if (state.query) doSearch(state.query, state.tab);
    else renderHome();
  });
});

// ── Init ──────────────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
renderHome();
</script>
</body>
</html>
